
package:
  # Was "zuspec-be-py" -- a copy-paste from the sibling repo. This is the
  # zuspec-be-sv manifest.
  name: zuspec-be-sv

  # Without this, ivpm falls back to "the first dep-set in the file", which is
  # `default` -- and `default` here is EMPTY, so a bare `ivpm update -a --py-pip`
  # (what CI runs, with no -d) installed nothing at all. The test step then died
  # on `./packages/python/bin/pytest: No such file or directory` and the docs
  # step on `sphinx-build: not found`.
  default-dep-set: default-dev

  setup-deps:
  - ninja
  - cython

  dep-sets:

  - name: default
    deps: []

  - name: default-dev
    deps:
    - name: zuspec-dataclasses
      url: https://github.com/zuspec/zuspec-dataclasses.git
    - name: zuspec-ir-core
      url: https://github.com/zuspec/zuspec-ir-core.git
    - name: pytest
      src: pypi
#    - name: pyhdl-if
##      url: https://github.com/fvutils/pyhdl-if.git
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
    - name: dv-flow-libformal
      url: https://github.com/dv-flow/dv-flow-libformal.git
    - name: Sphinx
      src: pypi
    - name: sphinx-argparse
      src: pypi
    - name: sphinxcontrib-makedomain
      src: pypi
    - name: sphinxcontrib-spelling
      src: pypi
    - name: sphinx-rtd-theme
      src: pypi


