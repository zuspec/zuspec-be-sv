[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zuspec-be-sv"
dynamic = ["version"]
description = "Zuspec SystemVerilog backend"
readme = "README.md"
# Was ">=3.7", which nothing here has ever been tested against and which is
# past end-of-life. 3.10 is the floor the rest of the estate declares and the
# oldest interpreter this source actually compiles under.
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"}
]

dependencies = [
    "zuspec-ir-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-dfm",
    "zuspec-dataclasses",
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/zuspec/zuspec-be-sv"
Repository = "https://github.com/zuspec/zuspec-be-sv"

[project.entry-points."zuspec.ext"]
zuspec_be_sv = "zuspec.be.sv.cli_plugin:SVBackendPlugin"

[tool.setuptools]
packages = ["zuspec.be.sv", "zuspec.be.sv.ir", "zuspec.be.sv.passes"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra --strict-markers --strict-config --showlocals"
markers = [
    "unit: Unit tests",
    "performance: Performance tests",
    "slow: Tests that take a long time to run",
    "integration: Integration tests",
]

[tool.black]
line-length = 100
target-version = ['py37']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

